<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7faf3" />
    <title>Negi-Teams · 作業一覧</title>
    <link rel="icon" type="image/svg+xml" href="/negi-icon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./expressive.css" />
  </head>
  <body class="negi-ui negi-workspace">
    <a class="md-skip-link" href="#stage">本文へ</a>
    <header class="topbar md-topbar">
      <div id="app-brand"></div>
      <div class="md-topbar-actions">
        <span id="conn-status" class="conn" role="status">接続中…</span>
        <button id="sidebar-toggle" class="sidebar-toggle md-icon-button" title="チーム一覧を開閉" aria-label="チーム一覧を開閉" aria-controls="sidebar" aria-expanded="false">☰</button>
        <button id="open-spawn" class="md-tonal">＋ 担当を追加</button>
        <button id="theme-toggle" class="md-icon-button md-theme-toggle" aria-label="テーマを切り替え">◐</button>
      </div>
    </header>
    <div class="md-shell">
      <nav id="app-navigation" class="md-rail" aria-label="メインナビゲーション"></nav>
      <main class="layout" data-view="overview">
        <section id="stage" class="stage" aria-label="作業スペース" tabindex="-1">
          <div id="workbench" class="overview" hidden></div>
          <div id="dashboard" class="dashboard" hidden></div>
          <div id="chat" class="chat" hidden></div>
          <div id="viewer" class="viewer" hidden></div>
          <div id="summary-panel" class="summary-panel" hidden>
            <div class="summary-head"><span class="summary-title">要約 <span id="summary-agent" class="summary-agent"></span></span><button id="summary-close" class="summary-close" aria-label="要約を閉じる">✕</button></div>
            <div id="summary-body" class="summary-body"></div>
          </div>
        </section>
        <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
        <aside id="sidebar" class="sidebar" aria-label="チーム一覧">
          <div class="registry">
            <h2>チームと資料</h2>
            <table id="registry-table"><thead><tr><th>担当</th><th>状態</th><th>接続</th><th>branch</th><th>cwd</th><th>pid</th></tr></thead><tbody></tbody></table>
            <button id="open-spawn-mobile" class="md-tonal">＋ 担当を追加</button>
          </div>
          <details class="log"><summary>通知</summary><ul id="notice-list"></ul></details>
        </aside>
      </main>
      <div id="key-assist" class="key-assist" hidden>
        <button class="ka-btn" data-key="esc">Esc</button><button class="ka-btn" data-key="tab">Tab</button><button class="ka-btn ka-ctrl" data-key="ctrl">Ctrl</button><button class="ka-btn" data-key="up">↑</button><button class="ka-btn" data-key="down">↓</button><button class="ka-btn" data-key="left">←</button><button class="ka-btn" data-key="right">→</button><button class="ka-btn" data-key="c-c">^C</button>
      </div>
    </div>
    <dialog id="spawn-dialog" class="md-dialog" aria-labelledby="spawn-title">
      <header><h2 id="spawn-title">担当を追加</h2><button id="spawn-close" class="md-icon-button md-text" aria-label="閉じる">✕</button></header>
      <div class="spawn-fields">
        <label>作業ディレクトリ<input id="spawn-cwd" type="text" placeholder="空欄ならサーバの既定" /></label>
        <label>接続先<select id="spawn-backend"><option value="">サーバの既定</option><option value="claude">Claude</option><option value="codex">Codex</option><option value="gemini">Gemini</option></select></label>
        <label class="md-switch-label"><input id="spawn-use-worktree" type="checkbox" />worktreeで作業を隔離する</label>
        <input id="spawn-repo" aria-label="リポジトリのパス" type="text" placeholder="repo パス（空欄なら作業ディレクトリ）" class="wt-field" hidden />
        <input id="spawn-branch" aria-label="ブランチ" type="text" placeholder="branch（空欄なら自動生成）" class="wt-field" hidden />
        <label class="md-switch-label"><input id="spawn-follow" type="checkbox" />起動した担当に表示を切り替える</label>
      </div>
      <div class="md-actions"><button id="spawn-btn" class="md-primary">担当を起動</button></div>
      <p class="muted">選択した接続先で新しいセッションを起動します。</p>
    </dialog>
    <div id="file-picker" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
